version: '3'

services:
  web:
    build: ./server
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_default_admin &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./server:/gam_backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: gam.settings
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: gam
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5439:5432"

#  frontend:
#    build: ./client
#    command: >
#      sh -c "npm run start"
#    volumes:
#      - ./client/src:/gam_frontend/src
#
#    ports:
#      - "3000:3000"
#    depends_on:
#      - web

  gitlab:
    image: gitlab/gitlab-ce:16.6.1-ce.0
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "1002:22"
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab

volumes:
  postgres_data: