version: '3'

services:
  web:
    build: ./server
    command: ["gunicorn", "gam.wsgi:application", "--bind", "0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: gam.settings
#    depends_on:
#      - postgres

  postgres:
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gam
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "1002:22"
    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - web
